# Railway cloud gateway — TLS Railway kenarında; container sadece HTTP
events {
  worker_connections 1024;
}

http {
  log_format structured_json escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
    '"uri":"$request_uri","status":$status,"bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,"upstream_time":"$upstream_response_time",'
    '"upstream_addr":"$upstream_addr","host":"$host"}';
  access_log /dev/stdout structured_json;
  error_log /dev/stderr warn;

  # Railway private DNS
  resolver fd12::10 valid=10s ipv6=on;
  resolver_timeout 5s;

  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

  proxy_connect_timeout 10s;
  proxy_read_timeout    60s;

  server {
    listen LISTEN_PORT;
    server_name _;

    include /etc/nginx/routes.conf;
  }
}
