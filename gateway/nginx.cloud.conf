daemon off;
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  access_log /dev/stdout;
  error_log /dev/stderr warn;

  # Railway private + genel DNS (IPv6 kapalı hesaplarda fd12 tek başına yetmeyebilir)
  resolver 8.8.8.8 fd12::10 valid=10s ipv6=on;
  resolver_timeout 5s;

  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

  proxy_connect_timeout 10s;
  proxy_read_timeout    60s;

  server {
    listen 0.0.0.0:LISTEN_PORT;
    server_name _;

    location = / {
      default_type application/json;
      return 200 '{"status":"ok","service":"gateway"}';
    }

    location = /health {
      default_type application/json;
      return 200 '{"status":"ok","service":"gateway","mode":"cloud-c1"}';
    }

    include /etc/nginx/routes.proxy.conf;
  }
}
