# ============================================================
# Auth-only gateway routes (Neon + Railway cloud login stack)
# Diğer mikroservisler bu deploy'da yok — 404 döner.
# ============================================================

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

location = /nginx_status {
  stub_status;
  allow 127.0.0.1;
  deny all;
}

# -- Auth Service -----------------------------------------
location = /api/auth/health {
  set $upstream http://auth-service:8001;
  proxy_pass $upstream/health;
}
location = /api/auth/docs {
  set $upstream http://auth-service:8001;
  proxy_pass $upstream/docs;
}
location = /api/auth/openapi.json {
  set $upstream http://auth-service:8001;
  proxy_pass $upstream/openapi.json;
}
location /api/auth/ {
  limit_req zone=api_limit burst=20 nodelay;
  set $upstream http://auth-service:8001;
  rewrite ^/api/auth/(.*)$ /auth/$1 break;
  proxy_pass $upstream;
}

# -- Gateway Health ---------------------------------------
location /health {
  return 200 '{"status":"ok","service":"gateway","mode":"auth-only"}';
  add_header Content-Type application/json;
}

location / {
  return 404 '{"error":"Route not found — auth-only cloud gateway"}';
  add_header Content-Type application/json;
}
