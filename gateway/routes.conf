add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

location = /nginx_status {
  stub_status;
  allow 127.0.0.1;
  deny all;
}

# -- Auth Service -----------------------------------------
location = /api/auth/health {
  set $upstream http://auth-service:8001;
  proxy_pass $upstream/health;
}
location = /api/auth/docs {
  set $upstream http://auth-service:8001;
  proxy_pass $upstream/docs;
}
location = /api/auth/openapi.json {
  set $upstream http://auth-service:8001;
  proxy_pass $upstream/openapi.json;
}
location /api/auth/ {
  limit_req zone=api_limit burst=20 nodelay;
  set $upstream http://auth-service:8001;
  rewrite ^/api/auth/(.*)$ /auth/$1 break;
  proxy_pass $upstream;
}

# -- Appointment Service -----------------------------------
location = /api/appointments/health {
  set $upstream http://appointment-service:8002;
  proxy_pass $upstream/health;
}
location = /api/appointments {
  limit_req zone=api_limit burst=20 nodelay;
  set $upstream http://appointment-service:8002;
  proxy_pass $upstream/appointments$is_args$args;
}
location /api/appointments/ {
  limit_req zone=api_limit burst=20 nodelay;
  set $upstream http://appointment-service:8002;
  rewrite ^/api/appointments/(.*)$ /appointments/$1 break;
  proxy_pass $upstream;
}
location = /api/waitlist {
  limit_req zone=api_limit burst=20 nodelay;
  set $upstream http://appointment-service:8002;
  proxy_pass $upstream/waitlist;
}
location /api/waitlist/ {
  limit_req zone=api_limit burst=20 nodelay;
  set $upstream http://appointment-service:8002;
  rewrite ^/api/waitlist/(.*)$ /waitlist/$1 break;
  proxy_pass $upstream;
}
location = /api/patient-notes {
  limit_req zone=api_limit burst=20 nodelay;
  set $upstream http://appointment-service:8002;
  proxy_pass $upstream/patient-notes$is_args$args;
}
location /api/patient-notes/ {
  limit_req zone=api_limit burst=20 nodelay;
  set $upstream http://appointment-service:8002;
  rewrite ^/api/patient-notes/(.*)$ /patient-notes/$1 break;
  proxy_pass $upstream;
}

# -- Inventory Service ------------------------------------
location = /api/inventory/health {
  set $upstream http://inventory-service:8003;
  proxy_pass $upstream/health;
}
location /api/inventory/ {
  limit_req zone=api_limit burst=20 nodelay;
  set $upstream http://inventory-service:8003;
  rewrite ^/api/inventory/(.*)$ /inventory/$1 break;
  proxy_pass $upstream;
}

# -- Analytics Service ------------------------------------
location = /api/analytics/health {
  set $upstream http://analytics-service:8004;
  proxy_pass $upstream/health;
}
location /api/analytics/ {
  limit_req zone=api_limit burst=30 nodelay;
  set $upstream http://analytics-service:8004;
  rewrite ^/api/analytics/(.*)$ /analytics/$1 break;
  proxy_pass $upstream;
}

# -- Integration Service ----------------------------------
location = /api/integration/health {
  set $upstream http://integration-service:8005;
  proxy_pass $upstream/health;
}
location /api/integration/ {
  limit_req zone=api_limit burst=5 nodelay;
  client_max_body_size 20m;
  set $upstream http://integration-service:8005;
  rewrite ^/api/integration/(.*)$ /integration/$1 break;
  proxy_pass $upstream;
}

# -- WhatsApp Ingestion Service ---------------------------
location = /api/whatsapp/health {
  set $upstream http://whatsapp-ingestion-service:8010;
  proxy_pass $upstream/health;
}
location /api/whatsapp/ {
  limit_req zone=api_limit burst=20 nodelay;
  set $upstream http://whatsapp-ingestion-service:8010;
  proxy_pass $upstream;
}

# -- Notification Service ---------------------------------
location /api/notifications/ {
  limit_req zone=api_limit burst=10 nodelay;
  set $upstream http://notification-service:3001;
  rewrite ^/api/notifications/(.*)$ /$1 break;
  proxy_pass $upstream;
}

# -- Gateway Health ---------------------------------------
location /health {
  return 200 '{"status":"ok","service":"gateway"}';
  add_header Content-Type application/json;
}

location / {
  return 404 '{"error":"Route not found"}';
  add_header Content-Type application/json;
}