# ============================================================
# DentAI Flow -- Nginx API Gateway
# ============================================================

events {
  worker_connections 1024;
}

http {
  log_format structured_json escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
    '"uri":"$request_uri","status":$status,"bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,"upstream_time":"$upstream_response_time",'
    '"upstream_addr":"$upstream_addr","host":"$host"}';
  access_log /dev/stdout structured_json;
  error_log /dev/stderr warn;

  # Docker DNS -- resolve per-request to handle container restarts
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 3s;

  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

  proxy_connect_timeout 5s;
  proxy_read_timeout    30s;

  server {
    listen 80;
    server_name _;

    include /etc/nginx/routes.conf;
  }

  server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    include /etc/nginx/routes.conf;
  }
}