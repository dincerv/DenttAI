# Bu dosya entrypoint tarafından routes.proxy.conf'a işlenir.
# Placeholders: AUTH_UPSTREAM / APPT_UPSTREAM

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_http_version 1.1;

# -- Auth -----------------------------------------------
location = /api/auth/health {
  proxy_pass AUTH_UPSTREAM/health;
}
location /api/auth/ {
  limit_req zone=api_limit burst=20 nodelay;
  rewrite ^/api/auth/(.*)$ /auth/$1 break;
  proxy_pass AUTH_UPSTREAM;
}

# -- Appointments ---------------------------------------
location = /api/appointments/health {
  proxy_pass APPT_UPSTREAM/health;
}
location = /api/appointments {
  limit_req zone=api_limit burst=20 nodelay;
  proxy_pass APPT_UPSTREAM/appointments$is_args$args;
}
location /api/appointments/ {
  limit_req zone=api_limit burst=20 nodelay;
  rewrite ^/api/appointments/(.*)$ /appointments/$1 break;
  proxy_pass APPT_UPSTREAM;
}
location = /api/waitlist {
  limit_req zone=api_limit burst=20 nodelay;
  proxy_pass APPT_UPSTREAM/waitlist;
}
location /api/waitlist/ {
  limit_req zone=api_limit burst=20 nodelay;
  rewrite ^/api/waitlist/(.*)$ /waitlist/$1 break;
  proxy_pass APPT_UPSTREAM;
}
location = /api/patient-notes {
  limit_req zone=api_limit burst=20 nodelay;
  proxy_pass APPT_UPSTREAM/patient-notes$is_args$args;
}
location /api/patient-notes/ {
  limit_req zone=api_limit burst=20 nodelay;
  rewrite ^/api/patient-notes/(.*)$ /patient-notes/$1 break;
  proxy_pass APPT_UPSTREAM;
}

location / {
  default_type application/json;
  return 404 '{"error":"Route not found"}';
}
