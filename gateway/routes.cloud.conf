# Auth + Appointment cloud gateway (C1)
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

location = /nginx_status {
  stub_status;
  allow 127.0.0.1;
  deny all;
}

# -- Auth -----------------------------------------------
location = /api/auth/health {
  set $upstream http://auth-service:8001;
  proxy_pass $upstream/health;
}
location /api/auth/ {
  limit_req zone=api_limit burst=20 nodelay;
  set $upstream http://auth-service:8001;
  rewrite ^/api/auth/(.*)$ /auth/$1 break;
  proxy_pass $upstream;
}

# -- Appointments ---------------------------------------
location = /api/appointments/health {
  set $upstream http://appointment-service:8002;
  proxy_pass $upstream/health;
}
location = /api/appointments {
  limit_req zone=api_limit burst=20 nodelay;
  set $upstream http://appointment-service:8002;
  proxy_pass $upstream/appointments$is_args$args;
}
location /api/appointments/ {
  limit_req zone=api_limit burst=20 nodelay;
  set $upstream http://appointment-service:8002;
  rewrite ^/api/appointments/(.*)$ /appointments/$1 break;
  proxy_pass $upstream;
}
location = /api/waitlist {
  limit_req zone=api_limit burst=20 nodelay;
  set $upstream http://appointment-service:8002;
  proxy_pass $upstream/waitlist;
}
location /api/waitlist/ {
  limit_req zone=api_limit burst=20 nodelay;
  set $upstream http://appointment-service:8002;
  rewrite ^/api/waitlist/(.*)$ /waitlist/$1 break;
  proxy_pass $upstream;
}
location = /api/patient-notes {
  limit_req zone=api_limit burst=20 nodelay;
  set $upstream http://appointment-service:8002;
  proxy_pass $upstream/patient-notes$is_args$args;
}
location /api/patient-notes/ {
  limit_req zone=api_limit burst=20 nodelay;
  set $upstream http://appointment-service:8002;
  rewrite ^/api/patient-notes/(.*)$ /patient-notes/$1 break;
  proxy_pass $upstream;
}

location /health {
  return 200 '{"status":"ok","service":"gateway","mode":"cloud-c1"}';
  add_header Content-Type application/json;
}

location / {
  return 404 '{"error":"Route not found"}';
  add_header Content-Type application/json;
}
