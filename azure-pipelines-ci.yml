# DentAI Flow — Azure DevOps CI (monolith)
trigger:
  branches:
    include:
      - main
      - develop

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  DOCKER_BUILDKIT: 1

stages:
- stage: Api
  displayName: 'API lint'
  jobs:
  - job: Lint
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.12'
    - script: |
        pip install --upgrade pip ruff
        pip install -r services/api/requirements.txt
        ruff check services/api/ shared/ --exit-zero
      displayName: 'Lint API + shared'

- stage: Ui
  displayName: 'UI build'
  dependsOn: []
  jobs:
  - job: Build
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'
    - script: |
        cd ui
        npm ci
        npm run build
      displayName: 'Build Next.js ui'

- stage: ComposeValidate
  displayName: 'Compose validate'
  dependsOn: []
  jobs:
  - job: Validate
    steps:
    - script: |
        docker compose -f docker-compose.yml config --quiet
        docker compose -f docker-compose.prod.yml config --quiet
      displayName: 'Validate compose files'
