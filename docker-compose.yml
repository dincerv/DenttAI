# ============================================================
# DentAI Flow — Geliştirme Docker Compose
#
# UI (3000) + Nginx Gateway (8081) + mikroservisler
# Build context: repo kökü (Dockerfile'lar shared/ kopyalar)
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: dentai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dentai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dentai_secret}
      POSTGRES_DB: ${POSTGRES_DB:-dentai_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./shared/db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    networks:
      - dentai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dentai} -d ${POSTGRES_DB:-dentai_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dentai_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret}
    ports:
      - "6379:6379"
    networks:
      - dentai-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: dentai_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-dentai}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-rabbitmq_secret}
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - dentai-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: dentai_auth
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dentai}:${POSTGRES_PASSWORD:-dentai_secret}@postgres:5432/${POSTGRES_DB:-dentai_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env (min 32 chars)}
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 60
      ALLOW_PUBLIC_REGISTER: ${ALLOW_PUBLIC_REGISTER:-false}
      SERVICE_PORT: 8001
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8001"
    networks:
      - dentai-network

  appointment-service:
    build:
      context: .
      dockerfile: services/appointment-service/Dockerfile
    container_name: dentai_appointment
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dentai}:${POSTGRES_PASSWORD:-dentai_secret}@postgres:5432/${POSTGRES_DB:-dentai_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/1
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-dentai}:${RABBITMQ_PASS:-rabbitmq_secret}@rabbitmq:5672/
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env (min 32 chars)}
      SERVICE_PORT: 8002
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    expose:
      - "8002"
    networks:
      - dentai-network

  inventory-service:
    build:
      context: .
      dockerfile: services/inventory-service/Dockerfile
    container_name: dentai_inventory
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dentai}:${POSTGRES_PASSWORD:-dentai_secret}@postgres:5432/${POSTGRES_DB:-dentai_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/3
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env (min 32 chars)}
      SERVICE_PORT: 8003
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8003"
    networks:
      - dentai-network

  analytics-service:
    build:
      context: .
      dockerfile: services/analytics-service/Dockerfile
    container_name: dentai_analytics
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dentai}:${POSTGRES_PASSWORD:-dentai_secret}@postgres:5432/${POSTGRES_DB:-dentai_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/4
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env (min 32 chars)}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SERVICE_PORT: 8004
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8004"
    networks:
      - dentai-network

  integration-service:
    build:
      context: .
      dockerfile: services/integration-service/Dockerfile
    container_name: dentai_integration
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dentai}:${POSTGRES_PASSWORD:-dentai_secret}@postgres:5432/${POSTGRES_DB:-dentai_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/5
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/5
      CELERY_BACKEND_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/5
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env (min 32 chars)}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-mock}
      WHATSAPP_MOCK: ${WHATSAPP_MOCK:-true}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_API_KEY: ${WHATSAPP_API_KEY:-}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}
      IMPORT_BATCH_SIZE: ${IMPORT_BATCH_SIZE:-200}
      SERVICE_PORT: 8005
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8005"
    networks:
      - dentai-network

  whatsapp-ingestion-service:
    build:
      context: .
      dockerfile: services/whatsapp-ingestion-service/Dockerfile
    container_name: dentai_whatsapp_ingestion
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dentai}:${POSTGRES_PASSWORD:-dentai_secret}@postgres:5432/${POSTGRES_DB:-dentai_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/6
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/5
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env (min 32 chars)}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      SERVICE_PORT: 8010
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8010"
    networks:
      - dentai-network

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: dentai_notification
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-dentai}:${RABBITMQ_PASS:-rabbitmq_secret}@rabbitmq:5672/
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/2
      DATABASE_URL: postgresql://${POSTGRES_USER:-dentai}:${POSTGRES_PASSWORD:-dentai_secret}@postgres:5432/${POSTGRES_DB:-dentai_db}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-mock}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_API_KEY: ${WHATSAPP_API_KEY:-}
      WHATSAPP_MOCK: ${WHATSAPP_MOCK:-true}
      SERVICE_PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    expose:
      - "3001"
    networks:
      - dentai-network

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: dentai_gateway
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - auth-service
      - appointment-service
      - inventory-service
      - analytics-service
      - integration-service
      - whatsapp-ingestion-service
      - notification-service
    networks:
      - dentai-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8081/api
    container_name: dentai_ui
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8081/api
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - dentai-network

volumes:
  postgres_data:
    name: dentai_postgres_data

networks:
  dentai-network:
    name: dentai_network
    driver: bridge
