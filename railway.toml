# DentAI Flow — Monolith API Railway konfigürasyonu
# railway.toml (repo kök — Railway bu dosyayı otomatik okur)
[build]
builder = "DOCKERFILE"
dockerfilePath = "services/api/Dockerfile"
buildCommand = ""

[deploy]
# Railway $PORT env var'ını otomatik inject eder
startCommand = "uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Bu servis için Railway'de şu env var'ları el ile set edilmeli:
#   JWT_SECRET             → güçlü random secret (min 32 char)
#   ENVIRONMENT            → production
#   CORS_ALLOWED_ORIGINS   → https://ui-url.up.railway.app
#   GEMINI_API_KEY         → opsiyonel
#   OPENAI_API_KEY         → opsiyonel
#   WHATSAPP_ACCESS_TOKEN  → opsiyonel
#
# Railway otomatik inject edenler (add-on kurulunca):
#   DATABASE_URL           → PostgreSQL add-on
#   REDIS_URL              → Redis add-on
