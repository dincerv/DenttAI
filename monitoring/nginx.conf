# ============================================================
# DentAI Flow — Monitoring Nginx Reverse Proxy
# Uptime Kuma ve Netdata'yı path-based proxy ile sunar.
# TLS terminate gerekirse bu katmana eklenebilir.
# ============================================================

events {
  worker_connections 256;
}

http {
  log_format structured_json escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
    '"uri":"$request_uri","status":$status,"bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,"upstream_time":"$upstream_response_time",'
    '"upstream_addr":"$upstream_addr","host":"$host"}';
  access_log /dev/stdout structured_json;
  error_log /dev/stderr warn;

  resolver 127.0.0.11 valid=5s ipv6=off;
  proxy_connect_timeout 5s;
  proxy_read_timeout 30s;

  server {
    listen 8090;
    server_name _;

    # Uptime Kuma — /status altından sun
    location /status/ {
      auth_basic "Monitoring";
      auth_basic_user_file /etc/nginx/.htpasswd;
      set $uptime http://uptime-kuma:3001;
      proxy_pass $uptime/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # Netdata — /netdata altından sun
    location /netdata/ {
      auth_basic "Monitoring";
      auth_basic_user_file /etc/nginx/.htpasswd;
      set $netdata http://netdata:19999;
      proxy_pass $netdata/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # Prometheus — /prometheus altından sun
    location /prometheus/ {
      auth_basic "Monitoring";
      auth_basic_user_file /etc/nginx/.htpasswd;
      rewrite ^/prometheus/?(.*)$ /$1 break;
      proxy_pass http://prometheus:9090;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # Grafana — /grafana altından sun
    location /grafana/ {
      auth_basic "Monitoring";
      auth_basic_user_file /etc/nginx/.htpasswd;
      proxy_pass http://grafana:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Alertmanager — /alertmanager altından sun
    location /alertmanager/ {
      auth_basic "Monitoring";
      auth_basic_user_file /etc/nginx/.htpasswd;
      rewrite ^/alertmanager/?(.*)$ /$1 break;
      proxy_pass http://alertmanager:9093;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location = /nginx_status {
      stub_status;
      allow 127.0.0.1;
      deny all;
    }

    # Root health
    location = /health {
      return 200 '{"status":"ok","service":"monitoring-proxy"}';
      add_header Content-Type application/json;
    }

    location / {
      return 404 '{"error":"Route not found"}';
      add_header Content-Type application/json;
    }
  }
}
