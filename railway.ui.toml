# DentAI Flow — Next.js Frontend Railway konfigürasyonu
[build]
builder = "NIXPACKS"
buildCommand = "cd ui && npm ci && npm run build"

[deploy]
startCommand = "cd ui && node .next/standalone/server.js"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"

# Bu servis için Railway'de şu env var'ları el ile set edilmeli:
#   NEXT_PUBLIC_API_URL → https://api-service.up.railway.app/api
